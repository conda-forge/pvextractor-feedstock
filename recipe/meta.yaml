{% set name = "pvextractor" %}
{% set version = "0.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 04019430bca5e66af762dd21f230dd292c87c5934a64774912c18da70a071ea2

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >={{ python_min }}
    - numpy >=1.22
    - astropy-base >=5.0
    - matplotlib-base >=3.5
    - scipy >=1.8
    - qtpy >=2.0
    - spectral-cube >=0.4

test:
  requires:
    - python {{ python_min }}
  imports:
    - pvextractor
    - pvextractor.gui
    - pvextractor.geometry

about:
  home: https://github.com/radio-astro-tools/pvextractor
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'Position-velocity diagram extractor'

extra:
  recipe-maintainers:
    - keflavich
    - astrofrog
